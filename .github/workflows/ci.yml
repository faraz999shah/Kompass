# Runs the checks from AGENTS.md section 5 on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Server starts and reports healthy
        run: |
          uvicorn app.main:app --port 8000 &
          for attempt in $(seq 1 20); do
            if curl --silent http://127.0.0.1:8000/health | grep -q '"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy" && exit 1

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npx prettier --check .
      - name: ESLint
        run: npx expo lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Jest
        run: npx jest --coverage
